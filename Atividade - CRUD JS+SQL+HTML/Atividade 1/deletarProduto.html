<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excluir Produto</title>
</head>
<body>
    <h1>Excluir Produto por Código</h1>
    
    <form action="/deletarProduto" method="POST">
        <label for="id">Informe o código (ID) do produto:</label><br><br>
        <input type="number" id="id" name="id" required><br><br>
        
        <button type="submit">Excluir produto</button>
    </form>
    
    <br><br>
    <a href="/">Inicio</a> 
    <a href="/listar">Ver lista de produtos</a>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const idUrl = urlParams.get('id');
    
    if (idUrl) {
        document.getElementById("id").value = idUrl;
    }
</script>
</body>
</html>
