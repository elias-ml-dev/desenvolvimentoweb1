<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Cadastro de Produtos</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        
        ul {
            list-style: none;
            padding: 0;
            width: 100%;
            max-width: 350px;
        }

        li {
            margin-bottom: 12px;
        }

        li a {
            display: block;
            background-color: #ffffff;
            color: #2980b9;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            font-weight: bold;
            text-align: center;
            transition: all 0.3s ease;
        }

        
        li a:hover {
            background-color: #2980b9;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>
    <h1>SISTEMA DE PRODUTOS</h1>
    <p>Escolha uma das opções abaixo:</p>

    <ul>
        <li><a href="/adicionar">Cadastrar produto</a></li>
        <li><a href="/listar">Listar produtos</a></li>
        <li><a href="/pesquisar">Pesquisar produto</a></li>
        <li><a href="/atualizar-form">Atualizar produto</a></li>
        <li><a href="/deletar-form">Excluir produto</a></li>
    </ul>
</body>
</html>
