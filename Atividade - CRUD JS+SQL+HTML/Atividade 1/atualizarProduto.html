<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Produtos</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 25px;
        }

        
        form {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 400px;
            box-sizing: border-box;
        }

        label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }

        
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            border-color: #2980b9;
            outline: none;
        }

        
        button[type="submit"] {
            background-color: #2980b9;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #2471a3;
        }

        
        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2980b9;
            text-decoration: none;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Atualizar Produtos</h1>

    <form id="formAtualizar" action="/atualizar" method="POST">
        <label for="id">Código do produto (ID):</label>
        <br>
        <input type="number" id="id" name="id" required>
        <br><br>
        <label for="nome">Novo nome:</label>
        <br>
        <input type="text" id="nome" name="nome" required>
        <br><br>
        <label for="quantidade">Nova quantidade:</label>
        <br>
        <input type="number" id="quantidade" name="quantidade" required>
        <br><br>
        <label for="preco">Novo preço:</label>
        <br>
        <input type="number" step="0.01" id="preco" name="preco"  required>
        <br><br>

        <button type="submit">Atualizar produto</button>
        
    </form>
    <a href="/">Inicio</a>

<script>
    const form = document.getElementById("formAtualizar");
    const campoId = document.getElementById("id");

    const urlParams = new URLSearchParams(window.location.search);
    const idUrl = urlParams.get('id');

    if (idUrl) {
        campoId.value = idUrl; 
    }

    form.addEventListener("submit", function() {
        form.action = "/atualizar/" + campoId.value;
    });
</script>
</body>
</html>
