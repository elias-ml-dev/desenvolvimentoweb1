<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atualizar Produtos</title>
</head>
<body>
    <h1>Atualizar Produtos</h1>

    <form action="/atualizar/${id}" method="POST">
        <label for="id">Código do produto (ID):</label>
        <br>
        <input type="number" id="id" name="id" required>
        <br><br>
        <label for="nome">Novo nome:</label>
        <br>
        <input type="text" id="nome" name="nome" value=${produto.nome} required>
        <br><br>
        <label for="quantidade">Nova quantidade:</label>
        <br>
        <input type="number" id="quantidade" name="quantidade" value=${produto.quantidade} required>
        <br><br>
        <label for="preco">Novo preço:</label>
        <br>
        <input type="number" step="0.01" id="preco" name="preco" value=${produto.preco} required>
        <br><br>

        <button type="submit">Atualizar produto</button>
        <a href="/listar">Listar produtos</a>

    </form>
</body>
</html>
