<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários HTML</title>
</head>
<body>
    
    <form method="post" action="" onsubmit="alert('Bem vindo ao sistema! ')"> 
        <h2> Bem vindo ao sistema! </h2>
        <p> Insira seus dados para logar</p>

        <label>Insira seu nome de usuário: </label> <br>
        <input type="text" name="login" placeholder="Insira seu nome" required> <br>
        <label>Insira sua senha: </label> <br>
        <input type="password" name="pwd" placeholder="Insira sua senha" required> <br> <br>
        <br> <br>

        <label>Insira seu email: </label> <br>
        <input type="email" name="email" placeholder="Insira seu email" required> <br> <br>


        <p>Qual seu meio de transporte?</p>
        <input type="checkbox" name="veiculo1" value="bicicleta">
        Eu tenho uma bicileta<br>
        <input type="checkbox" name="veiculo2" value="carro"> 
        Eu tenho um carro<br>
        <input type="checkbox" name="veiculo3" value="moto">
        Eu tenho uma moto <br> <br>

        <p>Qual é o seu sexo?</p>
        <input type="radio"
               id="feminino"
               name="sexo"
               value="feminino"
               required>
        <label for="feminino">Feminino</label>
        <br>
        <input type="radio"
               id = "masculino"
               name="sexo"
               value="masculino"
               required>
        <label for="masculino">Masculino</label>
        <br>
        <input type="radio"
               id = "nao-informar"
               name="sexo"
               value="nao-informar"
               required>
        <label for="nao-informar">Prefiro não informar</label>
        <br> <br>
        

        <p>Data de Nascimento</p>
        <input type="date" name="nascimento"> <br><br>
        

        <input type="submit">
    </form>
</body>
</html>
